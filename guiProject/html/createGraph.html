<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Create Graph | PRLog</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.highcharts.com/highcharts.js"></script>
</head>
<body class="bg-white text-black font-sans min-h-screen pb-24">
  <!-- Navbar -->
  <header class="flex justify-between items-center px-6 py-4 border-b">
    <h1 class="text-lg font-bold">PRLog</h1>
    <nav class="space-x-6 hidden md:flex items-center">
      <a href="/index" class="text-gray-700 hover:underline">Home</a>
      <a href="/features" class="text-gray-700 hover:underline">Features</a>

      <!-- dropdown-->
      <div class="relative group">

        <div class="flex flex-col">
          <a href="/addWorkout" class="text-gray-700 hover:underline">My Log</a>


          <div class="h-2 absolute top-full w-full"></div>
        </div>

        <div class="absolute hidden group-hover:block bg-white  w-48 z-10 border">
          <a href="/addWorkout" class="block px-4 py-2 text-gray-700 hover:bg-gray-100">Add Workout</a>
          <a href="/calendar" class="block px-4 py-2 text-gray-700 hover:bg-gray-100">Calendar</a>
          <a href="/createGraph" class="block px-4 py-2 text-gray-700 hover:bg-gray-100">Create Graph</a>
        </div>
        
      </div>
      <!-- -->

      <a href="/userProfile" class="bg-black text-white px-4 py-2 rounded hover:opacity-90">Profile</a>
    </nav>
  </header>
  

  <!-- Main Content -->
  <main class="max-w-2xl mx-auto px-4 py-12 text-center">
    <h2 class="text-4xl font-bold text-purple-500 mb-2">Create a Graph</h2>
    <p class="text-gray-600 mb-8">Select a date range and a workout to graph your progress over time.</p>

    <div class="flex gap-4">
      <a href="/addWorkout" class="bg-black text-white px-4 py-2 rounded hover:opacity-90">Add Workout</a>
      <a href="/calendar" class="bg-black text-white px-4 py-2 rounded hover:opacity-90">View Calendar</a>
    </div>

    <form id="graphForm" class="space-y-4">
      <!-- Start Date -->
      <div>
        <label for="startDate" class="block font-medium mb-1">Start Date</label>
        <input type="date" name="startDate" id="startDate" required class="w-full border px-3 py-2 rounded" />
      </div>

      <!-- End Date -->
      <div>
        <label for="endDate" class="block font-medium mb-1">End Date</label>
        <input type="date" name="endDate" id="endDate" required class="w-full border px-3 py-2 rounded" />
      </div>

      <!-- Workout Selection -->
      <div>
        <label for="workout" class="block font-medium mb-1">Workout</label>
        <input type="text" name="workout" id="workout" required class="w-full border px-3 py-2 rounded">

          <!-- We can add more later, or even better, pull only workout names that appear between selected dates -->
      </div>

      <!-- Submit Button -->
      <button id ="submitButton" type="submit" class="bg-black text-white px-4 py-2 rounded hover:opacity-90">
        Graph It!
      </button>
    </form>
  </main>




  
  <div id="container" style="width:100%; height:400px;"></div>



  <script>
    document.getElementById("graphForm").addEventListener('submit', function(e) {
      e.preventDefault();
      
      //collects form data from this submission
      const formData = new FormData(this);
      
      //sebds form data to server at route /generateGraph to get a response
      fetch('/generateGraph', {
        method: 'POST',
        body: formData
      })
      
      //change response to not be a json
      .then(function(response) {
        return response.json();
      })

      .then(function(data) {


        var newData = data.dates.map(function(date, index) {
          //loops to set newData values
          return {
            date: new Date(date).getTime(),
            weight: data.weights[index],
            reps: data.reps[index],
            sets: data.sets[index]
          };

        });
        
        //we need to sort by date or else the graph messes up
        newData.sort(function(a, b) {
          return a.date - b.date;
        });

        //create the chart
        Highcharts.chart('container', {
          chart: { type: 'line' },

          title: { text:'Progress' },

          xAxis: {
            type: 'datetime',
            title: { text: 'Date' },
            dateTimeLabelFormats: { day: '%m/%d/%Y' }
          },

          yAxis: [{
            title: { text: 'Weight(lbs)' }
          }, {
            title: { text: 'Reps/Sets' },
            opposite: true
          }],

          //settings for weight line
          series: [{
            name: 'Weight (lbs)',
            data: newData.map(d => [d.date, d.weight]),
            color: '#9f59f9',
            yAxis: 0
          }, 

          //settings for reps line
          {
            name: 'Reps',
            data: newData.map(d => [d.date, d.reps]),
            color: '#59b4f9',
            yAxis: 1,
            visible: false //hidden by default
          }, 
          //settinsg for sets line
          {
            name: 'Sets',
            data: newData.map(d => [d.date, d.sets]),
            color: '#59f9a5',
            yAxis: 1,
            visible: false //hidden by default
          }]
        });
      })
    });
  </script>





   <!-- Footer -->
    <footer class="border-t mt-16 px-6 py-4 text-sm text-gray-500 flex justify-between items-center">
      <span>PRLog</span>
      <div class="space-x-4">
        <a href="/index" class="hover:underline">Home</a>
        <a href="/features" class="hover:underline">Features</a>
        <a href="/signupPage" class="hover:underline">Sign Up</a>
      </div>
    </footer>
</body>
</html>
