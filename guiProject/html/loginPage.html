<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Log In | PRLog</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white text-black font-sans min-h-screen flex flex-col antialiased">
  <!-- Header -->
  <header class="sticky top-0 z-20 bg-white/80 backdrop-blur border-b">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="h-16 flex items-center justify-between">
        <a href="/index" class="text-xl font-extrabold tracking-tight">PRLog</a>

        <!-- Desktop nav -->
        <nav class="hidden md:flex items-center gap-6">
          <a href="/index" class="text-gray-700 hover:underline">Home</a>
          <a href="/features" class="text-gray-700 hover:underline">Features</a>
          <a href="/loginPage" class="font-semibold underline">Log in</a>
          <a href="/signupPage" class="bg-black text-white px-4 py-2 rounded-md hover:opacity-90">Sign up</a>
        </nav>

        <!-- Mobile menu button -->
        <button
          type="button"
          class="md:hidden inline-flex items-center justify-center p-2 rounded-md border"
          aria-controls="mobile-menu"
          aria-expanded="false"
          id="mobile_menu_button"
        >
          <span class="sr-only">Open main menu</span>
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor"><path d="M4 6h16v2H4zM4 11h16v2H4zM4 16h16v2H4z"/></svg>
        </button>
      </div>
    </div>

    <!-- Mobile menu -->
    <nav id="mobile-menu" class="md:hidden hidden border-t">
      <div class="px-4 py-3 space-y-2">
        <a href="/index" class="block px-3 py-2 rounded hover:bg-gray-50">Home</a>
        <a href="/features" class="block px-3 py-2 rounded hover:bg-gray-50">Features</a>
        <a href="/loginPage" class="block px-3 py-2 rounded font-semibold underline">Log in</a>
        <a href="/signupPage" class="block bg-black text-white px-3 py-2 rounded hover:opacity-90">Sign up</a>
      </div>
    </nav>
  </header>

  <!-- Main -->
  <main class="w-full grow">
    <section class="px-4 sm:px-6 lg:px-8 pt-10">
      <div class="w-full max-w-md mx-auto space-y-6">
        <h1 class="text-3xl sm:text-4xl font-bold text-center">Log in to your account</h1>

        <form action="/login" method="POST" class="space-y-4 border rounded-2xl p-6">
          <div>
            <label for="username" class="block mb-1 font-medium">Username</label>
            <input id="username" type="text" name="username" required class="w-full px-3 py-2 border rounded" />
          </div>

          <div>
            <label for="password" class="block mb-1 font-medium">Password</label>
            <div class="relative">
              <input id="password" type="password" name="password" required class="w-full px-3 py-2 border rounded pr-10" />
              <button type="button" id="toggle_pw" class="absolute inset-y-0 right-2 my-auto text-sm text-gray-600 hover:text-black">Show</button>
            </div>
          </div>

          <button type="submit" class="w-full bg-black text-white py-2 rounded hover:opacity-90">Log In</button>
        </form>

        {{ if .AddError }}
          <p class="text-red-500 text-center">{{ .AddError }}</p>
        {{ end }}

        <p class="text-center text-sm text-gray-600">
          Don't have an account?
          <a href="/signupPage" class="text-purple-600 hover:underline">Sign up</a>
        </p>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="w-full border-t mt-auto">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 text-sm text-gray-500 flex flex-col sm:flex-row items-center justify-between gap-3">
      <span class="font-medium">PRLog</span>
      <div class="flex gap-4">
        <a href="/index" class="hover:underline">Home</a>
        <a href="/features" class="hover:underline">Features</a>
        <a href="/signupPage" class="hover:underline">Sign Up</a>
      </div>
    </div>
  </footer>

  <script>
    const mobile_menu_btn = document.getElementById('mobile_menu_button');
    const mobile_menu = document.getElementById('mobile-menu');
    function toggleHidden(el){ el.classList.toggle('hidden'); }
    mobile_menu_btn?.addEventListener('click', () => {
      const expanded = mobile_menu_btn.getAttribute('aria-expanded') === 'true';
      mobile_menu_btn.setAttribute('aria-expanded', String(!expanded));
      toggleHidden(mobile_menu);
    });

    const toggle_pw = document.getElementById('toggle_pw');
    const pw = document.getElementById('password');
    toggle_pw?.addEventListener('click', () => {
      const isPwd = pw.type === 'password';
      pw.type = isPwd ? 'text' : 'password';
      toggle_pw.textContent = isPwd ? 'Hide' : 'Show';
    });
  </script>
</body>
</html>
