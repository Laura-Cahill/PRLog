<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Log In | PRLog</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white text-black font-sans min-h-screen flex flex-col">
  <!-- Top Navbar -->
  <header class="flex justify-between items-center px-6 py-4 border-b">
    <h1 class="text-xl font-bold">PRLog</h1>
    <nav class="space-x-4 hidden md:block">
      <a href="/index" class="text-gray-700 hover:underline">Home</a>
      <a href="/features" class="text-gray-700 hover:underline">Features</a>
      <a href="/loginPage" class="text-black font-semibold underline">Log in</a>
      <a href="/signupPage" class="text-gray-700 hover:underline">Sign up</a>
    </nav>
  </header>

  <!-- Form -->
  <main class="flex justify-center px-4 pt-10 grow">
    <div class="w-full max-w-md space-y-6">
      <h2 class="text-3xl font-bold text-center">Log in to your account</h2>
      <form action="/login" method="POST" class="space-y-4">
        <input type="text" name="username" placeholder="Username" required class="w-full px-4 py-2 border rounded" />
        <input type="password" name="password" placeholder="Password" required class="w-full px-4 py-2 border rounded" />
        <button type="submit" class="w-full bg-black text-white py-2 rounded hover:opacity-90">Log In</button>
      </form>

      {{ if .AddError }}
      <p class="text-red-500 justify-center text-center">{{ .AddError }}</p>
      {{ end }}
      
      <p class="text-center text-sm text-gray-600">
        Don't have an account?
        <a href="/signupPage" class="text-purple-600 hover:underline">Sign up</a>
      </p>
    </div>
  </main>


   <!-- Footer -->
    <footer class="w-full border-t px-6 py-4 text-sm text-gray-500 flex justify-between items-center">
      <span>PRLog</span>
      <div class="space-x-4">
        <a href="/index" class="hover:underline">Home</a>
        <a href="/features" class="hover:underline">Features</a>
        <a href="/signupPage" class="hover:underline">Sign Up</a>
      </div>
    </footer>
</body>
</html>
