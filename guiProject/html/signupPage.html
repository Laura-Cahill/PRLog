<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sign Up | PRLog</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white text-black font-sans min-h-screen pb-24">
  <!-- Top Navbar -->
  <header class="flex justify-between items-center px-6 py-4 border-b">
    <h1 class="text-xl font-bold">PRLog</h1>
    <nav class="space-x-4 hidden md:block">
      <a href="/index" class="text-gray-700 hover:underline">Home</a>
      <a href="/features" class="text-gray-700 hover:underline">Features</a>
      <a href="/loginPage" class="text-gray-700 hover:underline">Log in</a>
      <a href="/signupPage" class="text-black font-semibold underline">Sign up</a>
    </nav>
  </header>

  <!-- Form -->
  <main class="flex justify-center px-4 pt-10">
    <div class="w-full max-w-md space-y-6">
      <h2 class="text-3xl font-bold text-center">Create your account</h2>
      <form action="/signup" method="POST" class="space-y-4">
        <input type="text" name="username" placeholder="Username" required class="w-full px-4 py-2 border rounded" />
        <input type="email" name="email" placeholder="Email" required class="w-full px-4 py-2 border rounded" />
        <input type="password" name="password" placeholder="Password" required class="w-full px-4 py-2 border rounded" />
        <input type="text" name="name" placeholder="Name" required class="w-full px-4 py-2 border rounded" />
        <input type="number" name="age" placeholder="Age" required class="w-full px-4 py-2 border rounded" />
        <input type="text" name="color" placeholder="Favorite Color" required class="w-full px-4 py-2 border rounded" />
        <button type="submit" class="w-full bg-black text-white py-2 rounded hover:opacity-90">Sign Up</button>
      </form>
      <p class="text-center text-sm text-gray-600">
        Already have an account?
        <a href="/loginPage" class="text-purple-600 hover:underline">Log in</a>
      </p>
    </div>
  </main>

   <!-- Footer -->
    <footer class="border-t mt-16 px-6 py-4 text-sm text-gray-500 flex justify-between items-center">
      <span>PRLog</span>
      <div class="space-x-4">
        <a href="/index" class="hover:underline">Home</a>
        <a href="/features" class="hover:underline">Features</a>
        <a href="/signupPage" class="hover:underline">Sign Up</a>
      </div>
    </footer>
</body>
</html>
