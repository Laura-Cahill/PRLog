<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Reminder</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white text-black font-sans">
  <!-- Navbar -->
  <header class="flex justify-between items-center px-6 py-4 border-b">
    <h1 class="text-lg font-bold">PRLog</h1>
    <nav class="space-x-6">
      <a href="index.html" class="text-gray-700 hover:underline">Home</a>
      <a href="features.html" class="text-gray-700 hover:underline">Features</a>
      <a href="addWorkout.html" class="text-gray-700 hover:underline">My Log</a>
      <a href="userProfile.html">
        <button class="bg-black text-white px-4 py-2 rounded hover:opacity-90">
          User's Profile
        </button>
      </a>
    </nav>
  </header>

  <!-- Main Content -->
  <main class="px-6 py-12 max-w-3xl mx-auto text-center space-y-10">
    <div>
      <h2 class="text-4xl font-bold text-purple-500">Reminder</h2>
      <p class="text-gray-600 mt-2">Set a reminder for yourself so there’s no excuse to miss a workout!</p>
    </div>

    <!-- Reminder Form -->
    <form class="grid grid-cols-1 md:grid-cols-2 gap-4 items-center justify-center max-w-xl mx-auto">
      <label class="bg-purple-100 p-3 text-left font-medium rounded">Workout Title:</label>
      <input type="text" class="border p-3 rounded" placeholder="Leg Day" />

      <label class="bg-purple-100 p-3 text-left font-medium rounded">Day of the Week:</label>
      <input type="text" class="border p-3 rounded" placeholder="Monday" />

      <label class="bg-purple-100 p-3 text-left font-medium rounded">Time:</label>
      <input type="text" class="border p-3 rounded" placeholder="12:00 PM" />

      <label class="bg-purple-100 p-3 text-left font-medium rounded">Email:</label>
      <input type="email" class="border p-3 rounded" placeholder="john@gains.com" />
    </form>

    <!-- Submit Button -->
    <div class="mt-6">
      <button type="submit" class="bg-black text-white px-6 py-2 rounded hover:opacity-90">
        Set Reminder
      </button>
    </div>
  </main>

  <!-- Footer -->
    <footer class="border-t mt-16 px-6 py-4 text-sm text-gray-500 flex justify-between items-center">
      <span>PRLog</span>
      <div class="space-x-4">
        <a href="index.html" class="hover:underline">Home</a>
        <a href="features.html" class="hover:underline">Features</a>
        <a href="signupPage.html" class="hover:underline">Sign Up</a>
      </div>
    </footer>
</body>
</html>
