<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Future Workouts | PRLog</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white text-black font-sans">

  <!-- Navbar -->
  <header class="flex justify-between items-center px-6 py-4">
    <div class="text-lg font-semibold">PRLog</div>
    <nav class="flex items-center space-x-6">
      <a href="/index" class="hover:underline">Home</a>
      <a href="/features" class="hover:underline">Features</a>
      <a href="#" class="hover:underline">My Log</a>
      <a href="#" class="bg-black text-white px-4 py-2 rounded hover:opacity-90">User's Profile</a>
    </nav>
  </header>

  <!-- Main Section -->
  <main class="flex flex-col items-center justify-center text-center px-4 py-24">
    <h1 class="text-4xl font-bold text-purple-400 mb-6">Future Workouts</h1>
    <p class="text-gray-600 mb-12 max-w-lg">
      Select a date and plan your workout ahead of time.
    </p>

    <!-- Form -->
    <form class="w-full max-w-md mx-auto space-y-6 text-left" id="futureWorkoutsForm">

      <!-- Date Picker -->
      <div>
        <label for="workoutDate" class="block mb-1 font-medium">Workout Date:</label>
        <input type="date" id="workoutDate" class="w-full border px-3 py-2 rounded" />
      </div>

      <!-- Exercise -->
      <div>
        <label for="exercise" class="block mb-1 font-medium">Exercise:</label>
        <input type="text" id="exercise" placeholder="e.g. Bench Press" class="w-full border px-3 py-2 rounded" />
      </div>

      <!-- Sets -->
      <div>
        <label for="sets" class="block mb-1 font-medium">Sets:</label>
        <input type="number" id="sets" min="1" class="w-full border px-3 py-2 rounded" />
      </div>

      <!-- Reps -->
      <div>
        <label for="reps" class="block mb-1 font-medium">Reps:</label>
        <input type="number" id="reps" min="1" class="w-full border px-3 py-2 rounded" />
      </div>

      <!-- Weight -->
      <div>
        <label for="weight" class="block mb-1 font-medium">Weight (lbs):</label>
        <input type="number" id="weight" step="0.5" class="w-full border px-3 py-2 rounded" />
      </div>

      <!-- Notes -->
      <div>
        <label for="notes" class="block mb-1 font-medium">Notes (Optional):</label>
        <textarea id="notes" rows="3" class="w-full border px-3 py-2 rounded"></textarea>
      </div>

      <!-- Save Button -->
      <div class="flex flex-col items-center mt-4">
        <button type="submit" class="bg-purple-400 text-white px-6 py-2 rounded hover:bg-purple-500 active:bg-purple-600 active:scale-95 transition transform duration-75">
          Save Workout
        </button>
        
        <p id="confirmationMessage" class="text-black text-center font-semibold mt-4 hidden">
            Workout saved!
        </p>
      </div>

    </form>
  </main>

  <!-- Footer -->
  <footer class="border-t mt-16 px-6 py-4 text-sm text-gray-500 flex justify-between items-center">
    <span>PRLog</span>
    <div class="space-x-4">
      <a href="/index" class="hover:underline">Home</a>
      <a href="/features" class="hover:underline">Features</a>
      <a href="/signupPage" class="hover:underline">Sign Up</a>
    </div>
  </footer>

  <script src="/js/futureWorkouts.js"></script>
</body>
</html>
