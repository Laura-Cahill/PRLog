<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calendar</title>
</head>
<body class="bg-white text-black font-sans">
  <!-- Navbar -->
  <header class="flex justify-between items-center px-6 py-4">
    <div class="text-lg font-semibold">PRLog</div>
    <nav class="flex items-center space-x-6">
      <a href="index" class="hover:underline">Home</a>
      <a href="features" class="hover:underline">Features</a>
      <a href="addWorkout" class="hover:underline">My Log</a>
      <a href="userProfile" class="hover:underline">Profile</a>
    </nav>
  </header>
        <h1>hello {{.username}}, enter some data!</h1>
    <form action="/userInfo" method="POST">
        <input type="text" name="name" placeholder="Name" value="{{.name}}">
        <input type="number" name="age" placeholder="Age" value="{{.age}}">
        <input type="text" name="color" placeholder="color" value="{{.color}}">
        <input type="email" name="email" placeholder="email" value="{{.email}}">
        <button type="submit">Save Info</button>
    </form>

        <h1>current data:</h1>
        <p>name: {{.name}}</p>
        <p>age: {{.age}}</p>
        <p>favorite color: {{.color}}</p>
        <p>You've been a user since: {{.since}}</p>
        <p>Your email: {{.email}}</p>
</html>
