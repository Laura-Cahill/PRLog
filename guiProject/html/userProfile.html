<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Profile</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>
<body class="bg-white text-black font-sans min-h-screen flex flex-col">

  <!-- Navbar -->
  <header class="flex justify-between items-center px-6 py-4 border-b">
    <h1 class="text-lg font-bold">PRLog</h1>
    <nav class="space-x-6 hidden md:flex items-center">
      <a href="/index" class="text-gray-700 hover:underline">Home</a>
      <a href="/features" class="text-gray-700 hover:underline">Features</a>

      <!-- dropdown-->
      <div class="relative group">

        <div class="flex flex-col">
          <a href="/addWorkout" class="text-gray-700 hover:underline">My Log</a>


          <div class="h-2 absolute top-full w-full"></div>
        </div>

        <div class="absolute hidden group-hover:block bg-white  w-48 z-10 border">
          <a href="/addWorkout" class="block px-4 py-2 text-gray-700 hover:bg-gray-100">Add Workout</a>
          <a href="/calendar" class="block px-4 py-2 text-gray-700 hover:bg-gray-100">Calendar</a>
          <a href="/createGraph" class="block px-4 py-2 text-gray-700 hover:bg-gray-100">Create Graph</a>
        </div>
        
      </div>
      <!-- -->

      <a href="/userProfile" class="bg-black text-white px-4 py-2 rounded hover:opacity-90">Profile</a>
    </nav>
  </header>



  <!-- Main Content -->
  <main class="max-w-2xl mx-auto px-4 py-12 text-center grow">
    <h2 class="text-4xl font-bold text-purple-500 mb-2">My Profile</h2>
    <p class="text-gray-600 mb-8">This is your profile which has some information about your account.</p>

    <!-- Info Table -->


    <form action="/userInfo" method="POST" class="mb-6">
    <div class="grid grid-cols-2 text-left border border-gray-200 rounded overflow-hidden mb-8">

      <div class="bg-purple-100 px-4 py-3 font-medium">Name:</div>
      <input type="text" name="name" value="{{.name}}" />

      <div class="bg-purple-100 px-4 py-3 font-medium">Email:</div>
      <input type="email" name="email" value="{{.email}}" />

      <div class="bg-purple-100 px-4 py-3 font-medium">Joined:</div>
      <div class="px-4 py-3">{{.since}}</div>

      <div class="bg-purple-100 px-4 py-3 font-medium">Workouts Logged:</div>
      <div class="px-4 py-3">100</div>

    </div>
    <div class="text-center mt-4">
      <button type="submit" class="bg-black text-white px-6 py-2 rounded hover:opacity-90">Save Info</button>
    </div>
  </form>



    <!-- Log Out Button -->
    <form action="/logout" method="POST" class="text-center">
      <button type="submit" class="bg-black text-white px-6 py-2 rounded hover:opacity-90">Log Out</button>
    </form>
  </main>

  <!-- Footer -->
  <footer class="w-full border-t px-6 py-4 text-sm text-gray-500 flex justify-between items-center">
    <span>PRLog</span>
    <div class="space-x-4">
      <a href="/index" class="hover:underline">Home</a>
      <a href="/features" class="hover:underline">Features</a>
      <a href="/signupPage" class="hover:underline">Sign Up</a>
    </div>
  </footer>
</body>
</html>
